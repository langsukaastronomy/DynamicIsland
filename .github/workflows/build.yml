name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*')" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do
              unzip -oq "$z" -d "$(dirname "$z")"
            done
          fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan. Isi repository:"
            find . -type f -not -path './.git/*' | sort
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Proyek ada di: $(dirname "$S")"
          find "$(dirname "$S")" -type f -not -path '*/.git/*' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain -Pandroid.useAndroidX=true 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure() && env.PROJECT_DIR != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========== PENYEBAB ERROR ==========="
          grep -B2 -A12 -m3 -E "What went wrong|^e: |error:" build.log || tail -40 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidChat-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
